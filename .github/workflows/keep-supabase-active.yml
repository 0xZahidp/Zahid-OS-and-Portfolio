name: Keep Supabase Active

on:
  schedule:
    # Runs at 07:30 UTC every 3 days to prevent the 7-day inactivity pause
    - cron: '30 7 */3 * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  ping-supabase:
    name: Ping Application Health & Keep Supabase Active
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Application Health Ping Endpoint (/api/health-ping)
        env:
          SITE_URL: ${{ secrets.SITE_URL || secrets.APP_URL || secrets.NEXT_PUBLIC_APP_URL || 'https://zahidp.com' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://txrnbazpdyoaazszkwwq.supabase.co' }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "============================================="
          echo "  Supabase Keep-Alive Scheduled Heartbeat"
          echo "============================================="
          echo "Target Health URL: $SITE_URL/api/health-ping"
          echo "Timestamp: $(date -u +"%Y-%m-%d %H:%M:%SZ")"
          echo ""

          # 1. Ping the secure application health-ping endpoint
          echo "1. Pinging application /api/health-ping (service role DB query)..."
          PING_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "$SITE_URL/api/health-ping")
          HTTP_STATUS=$(echo "$PING_RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          BODY=$(echo "$PING_RESPONSE" | grep -v "HTTP_STATUS:")

          echo "HTTP Status: $HTTP_STATUS"
          echo "Body: $BODY"

          # 2. If service role key is in GitHub secrets, also directly touch PostgREST root as secondary heartbeat
          if [ -n "$SERVICE_KEY" ]; then
            echo ""
            echo "2. Sending authenticated service-role ping to Supabase REST root..."
            REST_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X GET \
              -H "apikey: $SERVICE_KEY" \
              -H "Authorization: Bearer $SERVICE_KEY" \
              "$SUPABASE_URL/rest/v1/")
            echo "Supabase REST Status: $REST_STATUS"
          fi

          echo ""
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "============================================="
            echo "  ✓ Supabase keep-alive ping successful!"
            echo "  7-day inactivity pause successfully prevented."
            echo "============================================="
          else
            echo "::warning::Health ping returned HTTP $HTTP_STATUS. Verify deployment and domain configuration."
          fi
