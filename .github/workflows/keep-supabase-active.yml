name: Keep Supabase Active

on:
  schedule:
    # Runs at 07:30 UTC every 3 days to prevent the 7-day inactivity pause
    - cron: '30 7 */3 * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  ping-supabase:
    name: Ping Supabase Database & REST API
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Supabase API to keep project alive
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://txrnbazpdyoaazszkwwq.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "============================================="
          echo "  Supabase Keep-Alive Scheduled Heartbeat"
          echo "============================================="
          echo "Target URL: $SUPABASE_URL"
          echo "Timestamp: $(date -u +"%Y-%m-%d %H:%M:%SZ")"
          echo ""

          if [ -z "$SUPABASE_KEY" ]; then
            echo "::warning::SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY is not set in GitHub Secrets."
            echo "Pinging public health endpoint without authentication..."
            
            HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SUPABASE_URL/rest/v1/")
            echo "Public REST endpoint response: $HEALTH_STATUS"
            
            echo ""
            echo "To enable full database query keep-alive, please add SUPABASE_ANON_KEY to your GitHub Secrets:"
            echo "👉 https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 0
          fi

          # 1. Ping database through PostgREST table query
          echo "1. Querying PostgreSQL table endpoint (/rest/v1/portfolio_content)..."
          DB_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/portfolio_content?select=id&limit=1")
          
          echo "Table Query HTTP Status: $DB_STATUS"

          # 2. Ping OpenAPI / PostgREST root endpoint
          echo ""
          echo "2. Sending authenticated ping to PostgREST root (/rest/v1/)..."
          REST_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/")
          
          echo "PostgREST Root HTTP Status: $REST_STATUS"

          echo ""
          if [ "$DB_STATUS" -eq 200 ] || [ "$DB_STATUS" -eq 206 ] || [ "$REST_STATUS" -eq 200 ]; then
            echo "============================================="
            echo "  ✓ Supabase project is active and alive!"
            echo "  7-day inactivity pause successfully prevented."
            echo "============================================="
          else
            echo "::warning::Unexpected response (DB: $DB_STATUS, REST: $REST_STATUS). Check project status."
          fi
