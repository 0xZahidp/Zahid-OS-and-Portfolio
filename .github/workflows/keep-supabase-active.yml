name: Keep Supabase Active

on:
  schedule:
    # Runs at 07:30 UTC every 3 days to prevent the 7-day inactivity pause
    - cron: '30 7 */3 * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  ping-supabase:
    name: Ping Application Health & Keep Supabase Active
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Application Health Ping Endpoint (/api/health-ping)
        env:
          SITE_URL: ${{ secrets.SITE_URL || 'https://zahidp.com' }}
        run: |
          echo "============================================="
          echo "  Supabase Keep-Alive Scheduled Heartbeat"
          echo "============================================="
          echo "Target Health URL: $SITE_URL/api/health-ping"
          echo "Timestamp: $(date -u +"%Y-%m-%d %H:%M:%SZ")"
          echo ""

          PING_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "$SITE_URL/api/health-ping")
          HTTP_STATUS=$(echo "$PING_RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          BODY=$(echo "$PING_RESPONSE" | grep -v "HTTP_STATUS:")

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response Body: $BODY"

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo ""
            echo "============================================="
            echo "  ✓ Supabase keep-alive ping successful!"
            echo "  7-day inactivity pause successfully prevented."
            echo "============================================="
          else
            echo ""
            echo "::error::Health ping failed with HTTP $HTTP_STATUS: $BODY"
            exit 1
          fi
